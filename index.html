<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wingfoil</title>
<meta name="description" content="A small wingfoiling simulator in the browser: wind gusts, swell, inflatable wing or parawing.">
<style>
  :root { --fg:#f4f7fa; --bg:#0b1a24; --accent:#ff7a59; --ok:#5fd3b5; --warn:#ff4d4d; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); font-family: system-ui, sans-serif; touch-action:none; }
  canvas { display:block; }
  #hud { position:fixed; left:16px; top:16px; color:var(--fg); text-shadow:0 1px 3px #000a; pointer-events:none; width:220px; }
  #speed { font-size:44px; font-weight:700; line-height:1; }
  #speed small { font-size:16px; font-weight:500; opacity:.8; }
  .row { font-size:14px; margin-top:4px; }
  #mode { font-weight:700; color:var(--accent); }
  .gauge { position:relative; height:8px; background:#0006; border-radius:4px; margin-top:3px; overflow:hidden; }
  .gauge .fill { position:absolute; top:0; bottom:0; background:var(--fg); border-radius:4px; }
  .gauge .band { position:absolute; top:0; bottom:0; background:#5fd3b555; }
  .gauge .mid { position:absolute; top:0; bottom:0; left:50%; width:2px; background:#fff8; }
  .lbl { font-size:11px; opacity:.85; margin-top:7px; display:flex; justify-content:space-between; }
  .pro-only { display:none !important; }
  body.pro .lbl.pro-only { display:flex !important; }
  body.pro .gauge.pro-only { display:block !important; }
  #wind { position:fixed; right:20px; top:16px; width:84px; height:84px; border-radius:50%;
          background:#0006; display:grid; place-items:center; color:var(--fg); font-size:12px; }
  #arrow { position:absolute; width:4px; height:54px; background:var(--fg); border-radius:2px; }
  #arrow::after { content:""; position:absolute; bottom:-6px; left:-6px; border:8px solid transparent; border-top:12px solid var(--fg); }
  #windtxt { position:absolute; bottom:-22px; width:140px; text-align:center; text-shadow:0 1px 3px #000a; }
  #map { position:fixed; right:16px; top:130px; width:150px; height:150px; border-radius:10px; background:#0006; }
  #help { position:fixed; left:16px; bottom:16px; color:var(--fg); font-size:13px; background:#0007; padding:8px 12px; border-radius:8px; line-height:1.6; max-width:calc(100vw - 56px); }
  #help b { color:var(--accent); }
  #toast { position:fixed; left:50%; top:22%; transform:translateX(-50%); color:#fff; font-size:22px; font-weight:700; text-shadow:0 2px 6px #000c; opacity:0; transition:opacity .25s; pointer-events:none; text-align:center; }
  #rec { position:fixed; right:20px; bottom:16px; color:#fff; background:#d33; padding:4px 10px; border-radius:6px; font-weight:700; display:none; }
  #toolbar { position:fixed; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:6px; z-index:5; }
  #toolbar button, .pbtn { background:#0009; color:var(--fg); border:1px solid #ffffff30; border-radius:8px; padding:6px 10px; font:600 13px system-ui; cursor:pointer; white-space:nowrap; }
  #toolbar button:hover, .pbtn:hover { background:#000c; border-color:#ffffff70; }
  #modePanel { position:fixed; top:54px; left:50%; transform:translateX(-50%); color:#fff; background:#0008; padding:6px 14px; border-radius:8px; font:600 15px system-ui; display:none; text-align:center; text-shadow:0 1px 2px #000; }
  #modePanel .garrow { display:inline-block; color:var(--ok); margin-right:6px; }
  #colors { position:fixed; top:56px; left:50%; transform:translateX(-50%); background:#0b1a24ee; color:#fff; padding:12px 14px; border-radius:10px; display:none; z-index:6; font-size:13px; }
  #colors .grid { display:grid; grid-template-columns:auto auto; gap:6px 12px; align-items:center; margin-bottom:10px; }
  #colors input { width:44px; height:26px; border:none; background:none; padding:0; }
  #photoBar { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); display:none; gap:8px; align-items:center; color:#fff; font-size:13px; text-shadow:0 1px 2px #000; }
  body.photo #hud, body.photo #help, body.photo #wind, body.photo #map, body.photo #toolbar, body.photo #modePanel, body.photo #toast { display:none !important; }
  body.photo #photoBar { display:flex; }
  #credit { position:fixed; right:12px; bottom:6px; font-size:10px; color:#fffb; text-shadow:0 1px 2px #000; }
  #credit a { color:#fffb; }
  body.photo #credit { display:none; }
  @media (max-width: 700px) { #toolbar { top:auto; bottom:84px; flex-wrap:wrap; justify-content:center; width:92vw; } #modePanel { top:12px; font-size:13px; } #map { display:none; } #hud { transform:scale(.8); transform-origin:top left; } #help { font-size:12px; } }
</style>
</head>
<body>
<div id="hud">
  <div id="speed">0.0 <small>kn</small></div>
  <div class="row"><span id="mode">Displacement</span> · <span id="pos">Beam reach</span></div>
  <div class="row" id="gear">Inflatable wing</div>
  <div class="row">Ride height <span id="height">0</span> cm · foil <span id="depth">0</span> cm deep</div>
  <div class="lbl"><span>wing power</span><span id="aoa">0°</span></div>
  <div class="gauge" id="gSheet"><div class="band"></div><div class="fill"></div></div>
  <div class="lbl pro-only"><span>front foot</span><span id="assist">assist on</span><span>back foot</span></div>
  <div class="gauge pro-only" id="gFeet"><div class="mid"></div><div class="fill"></div></div>

  <div class="gauge" id="gDepth"><div class="fill"></div></div>

</div>
<div id="wind"><div id="arrow"></div><div id="windtxt">wind</div></div>
<canvas id="map" width="150" height="150"></canvas>
<div id="toast"></div>
<div id="help"></div>
<div id="rec">● REC</div>
<div id="credit">Wing 3D model: <a href="https://sketchfab.com/3d-models/wing-foil-surf-4m-de7220b1b4ec4337b325cd02d5742b11" target="_blank" rel="noopener">“Wing Foil surf 4m”</a> by <a href="https://sketchfab.com/casamoderna" target="_blank" rel="noopener">casamoderna</a>, <a href="http://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> (modified)</div>
<div id="toolbar">
  <button id="bMode" title="G">Free ride</button><button id="bTod" title="L">☀ Day</button><button id="bCol" title="U">🎨 Colours</button>
  <button id="bPhoto" title="O">📷 Photo</button><button id="bSnd" title="N">🔊</button><button id="bRec" title="R">⏺</button>

  <button class="pbtn" id="cRand">Random</button> <button class="pbtn" id="cReset">Reset</button> <button class="pbtn" id="cClose">Close</button></div>
<div id="photoBar"><span>drag = orbit · wheel = zoom</span><button class="pbtn" id="pSave">Save PNG</button><button class="pbtn" id="pExit">Exit (O)</button></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const clamp = THREE.MathUtils.clamp, lerp = THREE.MathUtils.lerp, D2R = Math.PI / 180;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const _up = V3(0, 1, 0);

// ================================================================ renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.55;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 8000);

const SUN_ELEV = 16, SUN_AZ = 200;
const sunDir = new THREE.Vector3().setFromSphericalCoords(1, (90 - SUN_ELEV) * D2R, SUN_AZ * D2R);
const sky = new Sky();
sky.scale.setScalar(10000);
Object.entries({ turbidity: 3.2, rayleigh: 1.4, mieCoefficient: 0.004, mieDirectionalG: 0.86 })
  .forEach(([k, v]) => { sky.material.uniforms[k].value = v; });
sky.material.uniforms.sunPosition.value.copy(sunDir);
scene.add(sky);
// sky baked to a mipmapped cubemap: sharp reflections close by, blurred ones on rough / far water
const cubeRT = new THREE.WebGLCubeRenderTarget(512, { type: THREE.HalfFloatType, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter });
const cubeCam = new THREE.CubeCamera(1, 20000, cubeRT);
cubeCam.update(renderer, scene);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromCubemap(cubeRT.texture).texture;
const HORIZON = new THREE.Color(0.62, 0.72, 0.80);
scene.fog = new THREE.Fog(HORIZON, 300, 4500);

const sunLight = new THREE.DirectionalLight(0xfff1dd, 2.2);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
Object.assign(sunLight.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 120 });
sunLight.shadow.bias = -0.0005;
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x1a3a48, 0.5);
scene.add(sunLight, sunLight.target, hemi);

// ================================================================ wind field (same formula in JS and GLSL)
// True wind blows toward -Z (comes FROM +Z). Gust patches drift downwind; a slow band makes a stronger zone.
let WB = 7.5;   // base wind, m/s (~15 kn); the downwinder mode raises it
function windFactor(x, z, t) {
  const qx = x, qz = z + WB * 0.9 * t;
  const g1 = Math.sin(qx * 0.011 + 1.3 * Math.sin(qz * 0.007)) * Math.sin(qz * 0.009 + 1.1 * Math.sin(qx * 0.006 + 0.5));
  const g2 = Math.sin(qx * 0.031 + qz * 0.017 + 2.0) * Math.sin(qz * 0.027 - qx * 0.013);
  return 1 + 0.24 * g1 + 0.1 * g2 + 0.15 * Math.sin(x * 0.0015 + 0.7);
}
const WIND_GLSL = /* glsl */`
  uniform float uWB;
  float windFactor(vec2 p, float t) {
    vec2 q = vec2(p.x, p.y + uWB * 0.9 * t);
    float g1 = sin(q.x * 0.011 + 1.3 * sin(q.y * 0.007)) * sin(q.y * 0.009 + 1.1 * sin(q.x * 0.006 + 0.5));
    float g2 = sin(q.x * 0.031 + q.y * 0.017 + 2.0) * sin(q.y * 0.027 - q.x * 0.013);
    return 1.0 + 0.24 * g1 + 0.1 * g2 + 0.15 * sin(p.x * 0.0015 + 0.7);
  }`;

// ================================================================ waves (same in GPU and physics)
// dirX, dirZ, amplitude (m), wavelength (m). The first is a long downwind swell you can ride.
const WAVES = [
  [ 0.05, -1.00, 0.30, 70], [ 0.10, -1.00, 0.18, 38], [-0.35, -0.94, 0.15, 22], [ 0.45, -0.89, 0.10, 13],
  [-0.15, -0.99, 0.06,  8], [ 0.70, -0.71, 0.035, 5.0], [-0.60, -0.80, 0.025, 3.6],
].map(([x, z, a, l]) => { const n = Math.hypot(x, z); return [x / n, z / n, a, l]; });
const NW = WAVES.length, STEEP = 0.55, PHASES = WAVES.map((_, i) => i * 1.7);
function waveHeight(x, z, t) {
  let y = 0;
  for (let i = 0; i < NW; i++) {
    const [dx, dz, a, l] = WAVES[i], k = 2 * Math.PI / l;
    y += a * Math.sin(k * (dx * x + dz * z) - Math.sqrt(9.81 * k) * t + PHASES[i]);
  }
  return y;
}

// ================================================================ ocean
function makeOceanGeometry(R, N) {
  const pos = new Float32Array((N + 1) * (N + 1) * 3), idx = [], f = s => R * s * s * s;   // dense centre
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    const k = (j * (N + 1) + i) * 3; pos[k] = f(i / N * 2 - 1); pos[k + 2] = f(j / N * 2 - 1);
  }
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const a = j * (N + 1) + i, b = a + 1, c = a + N + 1, d = c + 1; idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setIndex(idx);
  return g;
}
const oceanMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 }, uWB: { value: WB }, uSteep: { value: STEEP },
    uWaves: { value: WAVES.map(w => new THREE.Vector4(...w)) }, uPhase: { value: PHASES },
    uSky: { value: cubeRT.texture }, uSun: { value: sunDir }, uLight: { value: 1 },
  },
  vertexShader: /* glsl */`
    uniform float uTime, uSteep; uniform vec4 uWaves[${NW}]; uniform float uPhase[${NW}];
    varying vec3 vWorld; varying vec3 vN; varying float vCrest; varying float vH;
    void main() {
      vec3 p = (modelMatrix * vec4(position, 1.0)).xyz;
      float dist = length(p.xz - cameraPosition.xz);
      vec3 disp = vec3(0.0), n = vec3(0.0, 1.0, 0.0); float crest = 0.0;
      for (int i = 0; i < ${NW}; i++) {
        vec4 w = uWaves[i];
        float A = w.z * clamp(1.0 - dist / (w.w * 40.0), 0.0, 1.0);
        float k = 6.28318 / w.w, om = sqrt(9.81 * k), Q = uSteep / (k * w.z * ${NW}.0);
        float f = k * dot(w.xy, p.xz) - om * uTime + uPhase[i], c = cos(f), s = sin(f);
        disp += vec3(Q * A * w.x * c, A * s, Q * A * w.y * c);
        n -= vec3(w.x * k * A * c, Q * k * A * s, w.y * k * A * c);
        crest += Q * k * A * s;
      }
      p += disp; vWorld = p; vN = n; vCrest = crest; vH = disp.y;
      gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform float uTime, uLight; uniform samplerCube uSky; uniform vec3 uSun;
    varying vec3 vWorld; varying vec3 vN; varying float vCrest; varying float vH;
    ${WIND_GLSL}
    float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    // value noise with analytic derivatives: returns (value, d/dx, d/dy)
    vec3 noised(vec2 x) {
      vec2 i = floor(x), f = fract(x), u = f * f * (3.0 - 2.0 * f), du = 6.0 * f * (1.0 - f);
      float a = hash(i), b = hash(i + vec2(1, 0)), c = hash(i + vec2(0, 1)), d = hash(i + vec2(1, 1));
      return vec3(a + (b - a) * u.x + (c - a) * u.y + (a - b - c + d) * u.x * u.y,
                  du * (vec2(b - a, c - a) + (a - b - c + d) * u.yx));
    }
    // wind chop: 5 octaves of noise, stretched so crests lie across the wind, drifting downwind.
    // returns (height, d/dx, d/dz) in world units
    vec3 chop(vec2 p, float t) {
      vec3 acc = vec3(0.0); float amp = 0.06, fr = 0.55;
      for (int i = 0; i < 5; i++) {
        float fi = float(i);
        float a = fi * 0.9;                                         // each octave slightly rotated
        mat2 R = mat2(cos(a), sin(a), -sin(a), cos(a));
        vec2 q = R * p; q.x *= 0.55;                                // stretch across the wind
        vec3 n = noised(q * fr + vec2(0.0, t * (0.9 + 0.35 * fi)));
        vec2 gq = n.yz * fr * vec2(0.55, 1.0);                      // gradient in rotated frame
        acc.x += amp * n.x; acc.yz += amp * (transpose(R) * gq);
        fr *= 1.95; amp *= 0.55;
      }
      return acc;
    }
    void main() {
      vec3 V = cameraPosition - vWorld; float dist = length(V); V /= dist;
      float wf = windFactor(vWorld.xz, uTime);
      float gust = smoothstep(0.85, 1.35, wf);                 // 0 = lull, 1 = strong gust
      float rf = 1.0 - smoothstep(30.0, 260.0, dist);           // detail fades out with distance
      vec3 ch = chop(vWorld.xz, uTime);
      float rough = mix(0.4, 1.5, gust);
      vec3 N = normalize(vN + vec3(-ch.y, 0.0, -ch.z) * rough * (0.25 + 0.75 * rf) * 2.2);
      if (dot(N, V) < 0.02) N = normalize(N + V * (0.02 - dot(N, V)));
      vec3 R = reflect(-V, N); R.y = abs(R.y);
      // blur the reflection with distance and roughness (mip level)
      float lod = clamp(log2(dist + 1.0) * 0.55 - 1.2 + gust * 1.2, 0.0, 6.0);
      vec3 refl = textureLod(uSky, R, lod).rgb * mix(1.05, 0.7, gust);
      float fres = 0.02 + 0.98 * pow(1.0 - max(dot(N, V), 0.0), 5.0);
      // body colour: deep blue-green, light through the wave crests when looking toward the sun
      vec3 deep = vec3(0.003, 0.03, 0.055), teal = vec3(0.03, 0.28, 0.30);
      vec3 sunH = normalize(vec3(uSun.x, 0.0, uSun.z));
      float toward = pow(max(dot(-V, sunH), 0.0), 2.0);
      float crestLit = clamp(vH * 1.3 + 0.35 + ch.x * 2.0, 0.0, 1.3);
      vec3 body = (deep + teal * crestLit * (0.18 + 0.9 * toward) * (0.6 + 0.4 * max(N.y, 0.0))) * uLight;
      vec3 col = mix(body, refl, fres);
      float sd = max(dot(R, uSun), 0.0);
      col += vec3(1.0, 0.93, 0.8) * (pow(sd, 1200.0) * 40.0 * (1.0 - gust * 0.5) + pow(sd, 120.0) * 0.5) * max(uLight, 0.25);
      // foam: steep crests + whitecaps only in strong wind, broken up by noise
      float fn = noised(vWorld.xz * vec2(1.2, 0.6) + vec2(0.0, uTime * 0.6)).x;
      float foam = smoothstep(0.6, 0.95, vCrest + (fn - 0.5) * 0.35) * 0.55;
      vec2 q = vWorld.xz * 0.35 + vec2(0.0, uWB * 0.2 * uTime);
      float wc = smoothstep(0.82, 0.97, noised(q).x * 0.6 + noised(q * 3.1).x * 0.4);
      foam += wc * smoothstep(1.12, 1.4, wf) * smoothstep(-0.1, 0.25, vH) * rf;
      col = mix(col, vec3(0.86, 0.91, 0.93) * uLight, clamp(foam, 0.0, 0.85));
      vec3 hz = textureLod(uSky, normalize(vec3(-V.x, 0.03, -V.z)), 2.0).rgb;
      col = mix(col, hz, 1.0 - exp(-dist * 0.0008));
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const ocean = new THREE.Mesh(makeOceanGeometry(4000, 480), oceanMat);
ocean.frustumCulled = false;
scene.add(ocean);

// ================================================================ materials
const M = {
  deck: new THREE.MeshStandardMaterial({ color: 0xf2f0ea, roughness: 0.35 }),
  rail: new THREE.MeshStandardMaterial({ color: 0x1d6f7a, roughness: 0.4 }),
  pad: new THREE.MeshStandardMaterial({ color: 0x2b2f33, roughness: 0.95 }),
  carbon: new THREE.MeshStandardMaterial({ color: 0x15171a, roughness: 0.3, metalness: 0.4 }),
  suit: new THREE.MeshStandardMaterial({ color: 0x1a1c20, roughness: 0.65 }),
  vest: new THREE.MeshStandardMaterial({ color: 0xff7a59, roughness: 0.55 }),
  skin: new THREE.MeshStandardMaterial({ color: 0xc48a68, roughness: 0.6 }),
  helmet: new THREE.MeshStandardMaterial({ color: 0xf5f5f0, roughness: 0.3 }),
  dacron: new THREE.MeshStandardMaterial({ color: 0x24343c, roughness: 0.8 }),
  handle: new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.7 }),
};
const shadowy = o => { o.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } }); return o; };

// ================================================================ board + foil (board frame: +Z nose, origin = hull bottom)
const MAST = 0.9, FW_Z = 0.12;   // front wing sits MAST below the hull, FW_Z ahead of the board centre
function makeBoard(railMat = M.rail) {
  const g = new THREE.Group();
  const L = 1.55, W = 0.62, H = 0.13;
  const s = new THREE.Shape();
  s.moveTo(0, -L / 2);
  s.bezierCurveTo(W * 0.42, -L / 2, W / 2, -L * 0.3, W / 2, 0);
  s.bezierCurveTo(W / 2, L * 0.3, W * 0.3, L / 2, 0, L / 2);
  s.bezierCurveTo(-W * 0.3, L / 2, -W / 2, L * 0.3, -W / 2, 0);
  s.bezierCurveTo(-W / 2, -L * 0.3, -W * 0.42, -L / 2, 0, -L / 2);
  const ex = (depth, bevel) => {
    const geo = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 4, curveSegments: 24 });
    geo.rotateX(Math.PI / 2); return geo;
  };
  const hull = new THREE.Mesh(ex(H - 0.06, 0.03), M.deck); hull.position.y = H - 0.03;
  const stripe = new THREE.Mesh(ex(0.03, 0.031), railMat); stripe.position.y = 0.045; stripe.scale.set(1.002, 1, 1.002);
  const pad = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.012, 0.95), M.pad); pad.position.set(0, H + 0.005, -0.12);
  g.add(hull, stripe, pad);
  const foil = new THREE.Group();
  const mast = new THREE.Mesh(new THREE.BoxGeometry(0.018, MAST, 0.12), M.carbon); mast.position.y = -MAST / 2;
  const fus = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.014, 0.75, 12), M.carbon);
  fus.rotation.x = Math.PI / 2; fus.position.set(0, -MAST, 0.05);
  const wingShape = (span, chord) => {
    const w = new THREE.Shape();
    w.moveTo(-span / 2, 0); w.quadraticCurveTo(0, chord * 1.3, span / 2, 0); w.quadraticCurveTo(0, -chord * 0.25, -span / 2, 0);

  S.vy += (S.foiling ? 0.35 : 0.55) * k;                   // unweight: lifts the board / foil
  S.legT = 0; S.legAnim = 0.45; S.stamina -= 0.06; S.glide = 0;
  if (combo > 1 && !quiet && e.player && !autopilot) toast('Pump combo!');
}
function wingPump(e = me) {
  const S = e.S, gear = e.gear;

  const combo = S.legT < 0.25 ? 1.5 : 1;
  const k = rhythm(S.wingT) * combo * clamp(S.wf, 0.7, 1.2) * gear.cfg.pump;
  S.pumpKick += 0.32 * k;

}
function pumpBoth(e = me) { wingPump(e); legPump(e, true); }

// wing aerodynamics: sheet (0..1) sets the angle of attack; past the stall angle lift drops
const sheetToAoa = sh => -4 + 32 * sh;                       // degrees
const aoaToSheet = a => (a + 4) / 32;
function wingCL(aoa, cfg) {
  const { clMax, stall } = cfg;
  if (aoa <= 0) return 0;
  if (aoa < stall) return clMax * aoa / stall;
  return Math.max(0.5, clMax - (aoa - stall) * 0.06);
}
function driveFraction(awa) {     // share of the wing force that pushes the board forward, vs apparent wind angle
  if (awa < 28) return 0;
  if (awa < 50) return smooth(28, 50, awa);
  if (awa < 120) return 1;

}

function step(e, dt, t) {
  const S = e.S, gear = e.gear;
  const fx = Math.sin(S.psi), fz = Math.cos(S.psi);
  S.wf = windFactor(S.x, S.z, t) * (1 + 0.05 * Math.sin(t * 0.9));
  S.wind = WB * S.wf;
  const wax = -fx * S.v, waz = -S.wind - fz * S.v;           // apparent wind velocity
  S.aws = Math.hypot(wax, waz);
  S.windFromX = -wax / S.aws; S.windFromZ = -waz / S.aws;
  S.awaDeg = Math.acos(clamp(fx * S.windFromX + fz * S.windFromZ, -1, 1)) / D2R;
  S.twaDeg = Math.acos(clamp(fz, -1, 1)) / D2R;
  // windward side with hysteresis, so dead upwind/downwind does not flicker
  const sd = Math.cos(S.psi) * S.windFromX - Math.sin(S.psi) * S.windFromZ;   // board +X axis · wind-from
  if (sd > 0.2) S.side = 1; else if (sd < -0.2) S.side = -1;
  S.ts += clamp(S.side - S.ts, -1.6 * dt, 1.6 * dt);           // stance switch takes ~1.2 s

  // ---- controls
  let steer = 0, feetIn = 0;
  const stall = gear.cfg.stall;

    const gt = race.active && !e.ai && me.gate < race.gates.length ? race.gates[me.gate].c : null;   // autopilot races too
    const target = e.ai ? e.aiTarget(t) : gt ? sailable(Math.atan2(gt.x - S.x, gt.z - S.z)) : (Math.floor(t / 25) % 2 ? -1 : 1) * 100 * D2R;
    steer = clamp(Math.atan2(Math.sin(target - S.psi), Math.cos(target - S.psi)) * 1.5 + 0.25 * Math.sin(t * 0.7 + (e.phase || 0)), -1, 1);
    const want = aoaToSheet(S.depth < 0.25 || S.hrel > 0.7 ? 4 : S.wf > 1.2 ? stall - 6 : stall - 2);
    S.sheet += clamp(want - S.sheet, -dt, dt);
    if (!S.foiling && S.crash <= 0 && S.v > 0.5 && S.legT > 0.9) pumpBoth(e);
    S.assist = true;
  } else if (S.pro) {
    steer = (keys.KeyA || keys.ArrowLeft ? 1 : 0) - (keys.KeyD || keys.ArrowRight ? 1 : 0);
    feetIn = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
    if (keys.ArrowUp || keys.KeyI) S.sheet = clamp(S.sheet + dt * 0.7, 0, 1);
    if (keys.ArrowDown || keys.KeyK) S.sheet = clamp(S.sheet - dt * 0.7, 0, 1);
  } else {
    // simple: the wing trims itself; W = max power, S = depower; feet are automatic
    steer = (keys.KeyA || keys.ArrowLeft ? 1 : 0) - (keys.KeyD || keys.ArrowRight ? 1 : 0) + touch.steer;
    const more = keys.KeyW || keys.ArrowUp, less = keys.KeyS || keys.ArrowDown;
    const want = aoaToSheet(more ? stall : less ? 2 : stall - 4);
    S.sheet += clamp(want - S.sheet, -dt * 1.5, dt * 1.5);
    S.assist = true;
  }
  S.steer += (clamp(steer, -1, 1) - S.steer) * Math.min(1, dt * 4);
  S.feetIn += (feetIn - S.feetIn) * Math.min(1, dt * 5);
  S.legT += dt; S.wingT += dt;
  S.legAnim = Math.max(0, S.legAnim - dt); S.wingAnim = Math.max(0, S.wingAnim - dt);
  S.stamina = Math.min(1, S.stamina + dt * 0.07);

  // ---- surface under the board and under the front wing
  const ws = waveHeight(S.x, S.z, t);
  S.wsSmooth += (ws - S.wsSmooth) * Math.min(1, dt * 1.5);
  const yFw = S.yb - MAST * Math.cos(S.pitch) + FW_Z * Math.sin(S.pitch);
  S.depth = waveHeight(S.x + fx * FW_Z, S.z + fz * FW_Z, t) - yFw;
  S.hrel = S.yb - S.wsSmooth;

  if (S.crash > 0) {
    S.crash -= dt; S.v *= Math.exp(-dt * 2); S.pumpKick = 0;
    S.yb += (ws - 0.04 - S.yb) * Math.min(1, dt * 4); S.vy = 0; S.pitch *= Math.exp(-dt * 3);
    S.foiling = false; S.contact = true; S.feet = 0;

  } else {
    // ---- wing
    S.aoa = sheetToAoa(S.sheet) + 14 * Math.sin(Math.PI * clamp(S.wingAnim / 0.5, 0, 1));
    S.wingForce = 0.5 * RHO_AIR * gear.cfg.area * wingCL(S.aoa, gear.cfg) * S.aws * S.aws;
    const drive = S.wingForce * driveFraction(S.awaDeg);
    // ---- feet -> board pitch -> foil angle of attack
    let assist = 0;
    if (S.assist && S.v > 3.8) {
      // aim for ride height, but never let the front wing get shallower than ~35 cm
      const err = Math.max(S.hrel - FLY_H, (0.35 - S.depth) * 1.5);
      assist = clamp((-err * 2.2 - S.vy * 0.9) * clamp((7 / S.v) ** 2, 0.3, 1.5), -1, 1);   // lift ~ v², keep loop gain flat
    }
    S.feet = S.air ? 0 : clamp(S.feetIn + assist * (S.assist ? 0.9 : 0), -1, 1);       // in the air: hold the board level
    const legOsc = S.legAnim > 0 ? 0.07 * Math.sin(2 * Math.PI * (1 - S.legAnim / 0.45)) : 0;
    S.pitch += ((S.air ? 0.05 : 0.03 + 0.14 * S.feet + legOsc) - S.pitch) * Math.min(1, dt * 5);
    // ---- foil lift: needs speed, dies when the front wing gets close to the surface (ventilation)
    const vent = smooth(-0.02, 0.12, S.depth);
    const lift = 0.5 * RHO_W * FOIL_AREA * S.v * S.v * clamp(0.25 + 5 * S.pitch, -0.3, 1.1) * vent;
    // ---- hull: buoyancy spring when the board sits in the water
    const sink = ws - 0.04 - S.yb;
    S.contact = sink > -0.005;
    const buoy = sink > 0 ? 40000 * sink - 900 * S.vy : 0;
    const wasFoiling = S.foiling;
    // in the air the wing gives a little hang time
    const hang = S.air ? S.wingForce * 0.25 : 0;
    S.vy += ((lift * Math.cos(S.pitch) + buoy + hang) / MASS - G - (S.air ? 0.15 : 1.2 + 3 * vent) * S.vy) * dt;
    S.yb += S.vy * dt;
    if (S.air) {
      S.airT += dt; S.airMax = Math.max(S.airMax, S.yb - ws);
      if (S.contact) { S.air = false; if (S.vy < -2.5) return crash(e, 'Flat landing on the board!'); S.vy *= 0.3; }
      else if (S.vy < 0 && S.depth > 0.12) {                            // foil back in the water: landed
        S.air = false;
        if (S.vy < -5.2) return crash(e, 'Hard landing!');
        S.v *= 0.92; S.vy *= 0.3; splash(e, 2);                         // legs absorb the landing
        if (e.player) { toast(`Jump! ${S.airMax.toFixed(1)} m · ${S.airT.toFixed(1)} s`); bestJump(S.airMax, S.airT); }
      }
    }
    if (wasFoiling && S.contact && S.vy < -1.4) return crash(e, 'Nose-dive! Touched down too hard');
    if (wasFoiling && !S.air && S.depth < -0.01) return crash(e, 'Breach! The foil came out of the water');
    S.glide = S.foiling ? S.glide + dt : 0;
    S.foiling = S.yb > ws + 0.03;
    if (wasFoiling && !S.foiling && S.contact) splash(e, 1.2);
    // ---- horizontal
    const hullDrag = S.contact ? 6 * S.v * S.v + 18 * S.v : 0;
    const foilDrag = (S.v > 0.5 ? 2.6 * S.v * S.v + 8 : 0) + 0.0006 * lift * lift / Math.max(S.v, 2) ** 2;
    const turnDrag = Math.abs(S.steer) * S.v * 14;
    // waves: gravity along the local slope pushes you down a swell face
    const sl = 0.8, slope = (waveHeight(S.x + fx * sl, S.z + fz * sl, t) - waveHeight(S.x - fx * sl, S.z - fz * sl, t)) / (2 * sl);
    const kick = S.pumpKick * Math.min(1, dt * 6); S.pumpKick -= kick;
    S.v = Math.max(0, S.v + ((drive - hullDrag - foilDrag - turnDrag) / MASS - G * slope * 0.6) * dt + kick);
    S.psi += S.steer * (0.35 + 0.05 * S.v) * dt;
    S.slope = slope;
    if (e.ai && S.foiling && !S.air && S.v > 7.5 && Math.random() < dt * 0.03) jump(e);   // AI riders show off now and then
  }
  S.x += fx * S.v * dt; S.z += fz * S.v * dt;
}
// pop off the water: harder going up a swell face (it acts as a kicker)
function jump(e = me) {
  const S = e.S;
  if (!S.foiling || S.air || S.crash > 0 || S.v < 5 || S.depth < 0.15) { if (e.player && !S.foiling) toast('Get foiling first, then jump'); return; }
  S.vy += 2.4 + 0.12 * S.v + Math.max(0, S.slope || 0) * 30;
  S.air = true; S.airT = 0; S.airMax = 0; S.legAnim = 0.45; S.glide = 0;
}
function crash(e, msg) {
  const S = e.S;
  S.crash = 2.5; S.crashType = msg.startsWith('Breach') ? 'breach' : 'dive';
  S.v *= 0.25; S.vy = 0; S.foiling = false; S.pumpKick = 0; S.air = false; S.glide = 0;
  splash(e, 6); if (e.player) toast(msg);
}
function splash(e, strength) {
  const S = e.S, p = V3(S.x, waveHeight(S.x, S.z, simT), S.z);
  emit(p, V3(0, 1.5 * strength, 0), 1.6 * strength, Math.round(60 * strength));
  sfxSplash(strength, p);
}

// ================================================================ pose
// points used to keep the gear clear of the board, the water and the rider: tips, trailing edge, canopy
function addSamples(g) {
  g.samples = [];
  for (const s of [-1, -0.7, -0.35, 0, 0.35, 0.7, 1]) {
    g.samples.push(g.sh.arc(s), g.sh.T(s));
    for (const u of [0.35, 0.7]) g.samples.push(g.sh.L(s).lerp(g.sh.T(s), u));
  }
}
Object.values(gears).forEach(addSamples);
const lowestPoint = (q, p, g = gear) => Math.min(...g.samples.map(s => s.clone().applyQuaternion(q).add(p).y));

function pose(e, dt, t) {
  const S = e.S, board = e.board, rider = e.rider, P = e.P, gear = e.gear, wingQ = e.wingQ;
  let crashBlend = e.crashBlend;
  const fx = Math.sin(S.psi), fz = Math.cos(S.psi);
  const wh = waveHeight(S.x, S.z, t);
  const inWater = S.contact || S.crash > 0;
  const sl = 0.6;
  const pitchW = inWater ? (waveHeight(S.x + fx * sl, S.z + fz * sl, t) - waveHeight(S.x - fx * sl, S.z - fz * sl, t)) / (2 * sl) : 0;
  const rollW = inWater ? (waveHeight(S.x + fz * sl, S.z - fx * sl, t) - waveHeight(S.x - fz * sl, S.z + fx * sl, t)) / (2 * sl) : 0;
  crashBlend += ((S.crash > 0 ? 1 : 0) - crashBlend) * Math.min(1, dt * 5);
  e.crashBlend = crashBlend;
  board.position.set(S.x, S.yb, S.z);
  board.rotation.set(-(S.pitch + Math.atan(pitchW)), S.psi, -S.steer * 0.35 * smooth(1, 6, S.v) + Math.atan(rollW) + crashBlend * 0.3, 'YXZ');

  // ---- rider: faces leeward; S.ts runs -1..1 through a foot switch
  const ts = S.ts, sgn = ts >= 0 ? 1 : -1;
  rider.rotation.order = 'YXZ';
  rider.rotation.y = -Math.PI / 2 * ts;
  const leanT = clamp(S.wingForce / (MASS * G) * 0.9, 0, 0.45) * (S.crash > 0 ? 0 : 1);
  S.lean += (leanT - S.lean) * Math.min(1, dt * 4);
  const fall = crashBlend * 1.35;
  rider.rotation.x = -S.lean + (S.crashType === 'dive' ? fall : fall * 0.4);
  rider.rotation.z = S.crashType === 'breach' ? -sgn * fall : 0;
  rider.position.y = 0.14 - crashBlend * 0.5;
  const legP = S.legAnim > 0 ? Math.sin(Math.PI * (1 - S.legAnim / 0.45)) : 0;
  const wingP = S.wingAnim > 0 ? Math.sin(Math.PI * (1 - S.wingAnim / 0.5)) : 0;
  const crouch = 0.17 * legP + (S.foiling ? 0.06 : 0.1) + 0.05 * wingP + (S.air ? 0.22 : 0);
  const fxR = ts, shift = S.feet * 0.09 * sgn;               // front foot = +X when ts > 0; hips move toward the loaded foot
  const hip = V3(-shift, 0.95 - crouch, -0.04);
  const footF = V3(fxR * 0.3, 0.05, 0.02 * (1 - Math.abs(ts))), footB = V3(-fxR * 0.28, 0.05, -0.02 * (1 - Math.abs(ts)));
  [[footF, P.thighL, P.shinL, P.footL], [footB, P.thighR, P.shinR, P.footR]].forEach(([foot, thigh, shin, fm], i) => {
    const h0 = hip.clone().add(V3((i ? -1 : 1) * 0.09 * sgn, 0, 0));
    const knee = ik(h0, foot, 0.46, 0.46, V3((i ? -1 : 1) * 0.3 * sgn, 0.2, 1));
    placeSeg(thigh, h0, knee); placeSeg(shin, knee, foot);
    fm.position.copy(foot).add(V3(0, -0.02, 0.03)); fm.rotation.y = Math.PI / 2;
  });
  const neck = hip.clone().add(V3(0, 0.55, 0.04));
  placeSeg(P.torso, hip.clone().add(V3(0, 0.1, 0)), neck);
  P.hips.position.copy(hip);
  const headP = neck.clone().add(V3(0, 0.19, 0.03));
  placeSeg(P.neck, neck, headP);
  P.head.position.copy(headP); P.head.rotation.y = ts * 0.7;

  // ---- gear orientation (world), from the apparent wind and the angle of attack
  board.updateMatrixWorld(true);
  const cfg = gear.cfg;
  const flow = V3(-S.windFromX, 0, -S.windFromZ).normalize();
  const teDir = flow.clone().applyAxisAngle(_up, -ts * clamp(S.aoa, -4, 30) * D2R);   // trailing edge toward the tail
  const windward = V3(S.windFromX, 0, S.windFromZ);
  const zAx = teDir.clone().negate();
  const handMid = rider.localToWorld(cfg.hold.clone().add(V3(0, -crouch * 0.6, -0.22 * wingP)));
  const strutLocal = cfg.handles[0].clone().add(cfg.handles[1]).multiplyScalar(0.5);
  const qFor = cant => {
    const xAx = V3(0, Math.cos(cant), 0).addScaledVector(windward, Math.sin(cant));
    xAx.addScaledVector(zAx, -xAx.dot(zAx)).normalize();
    const yAx = V3().crossVectors(zAx, xAx);
    if (yAx.dot(windward) < 0) { xAx.negate(); yAx.negate(); }          // rider side faces the rider / wind
    return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(xAx, yAx, zAx));
  };
  const posFor = q => handMid.clone().sub(strutLocal.clone().applyQuaternion(q));
  // keep every tip / trailing-edge point above the deck and the water: try cants near the natural one
  // ...and away from the rider's head and chest
  const floor = Math.max(S.yb + 0.4, wh + 0.3);
  const body = [rider.localToWorld(headP.clone()), rider.localToWorld(neck.clone().add(V3(0, -0.2, 0)))];
  const near = { d: 9, dir: V3() };
  const bodyGap = (q, p) => {
    near.d = 9;
    for (const sp of gear.samples) {
      const w = sp.clone().applyQuaternion(q).add(p);
      for (const b of body) { const d = w.distanceTo(b); if (d < near.d) { near.d = d; near.dir.subVectors(w, b).normalize(); } }
    }
    return near.d;
  };
  let best = null;
  for (const dc of [0, 0.12, -0.12, 0.24, -0.24, 0.36, -0.36, 0.5]) {
    const q = qFor(cfg.cant + dc - 0.15 * wingP), pp = posFor(q), lo = lowestPoint(q, pp, gear), gap = bodyGap(q, pp);
    const score = Math.min(lo - floor, gap - 0.4);
    if (!best || score > best.score) best = { q, score };
    if (score >= 0) break;
  }
  // crashed: gear floats flat on the water, rider side up
  const zC = V3(fx, 0, fz), yC = V3(0, 1, 0), xC = V3().crossVectors(yC, zC);
  const qCrash = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(xC, yC, zC));
  wingQ.slerp(best.q.clone().slerp(qCrash, crashBlend), 1 - Math.exp(-dt * 9));
  const g = gear.group;
  g.quaternion.copy(wingQ);
  // position from the smoothed orientation; if still too low, lift it (the arms stretch)
  const ridePos = posFor(wingQ);
  const lo = lowestPoint(wingQ, ridePos, gear);
  if (lo < floor) ridePos.y += (floor - lo) * (1 - crashBlend);
  for (let k = 0; k < 3; k++) {                      // push straight away from the nearest body point
    const gap = bodyGap(wingQ, ridePos);
    if (gap >= 0.4) break;
    ridePos.addScaledVector(near.dir, (0.42 - gap) * (1 - crashBlend));
  }
  if (e.player) window.__gap = bodyGap(wingQ, ridePos);
  const crashPos = V3(S.x - windward.x * 2, wh + 0.15, S.z - windward.z * 2);
  g.position.copy(ridePos.lerp(crashPos, crashBlend));
  g.updateMatrixWorld(true);
  const luff = 1 - smooth(2, 9, S.aoa);
  if (!gear.model) updateCanopy(gear, (cfg.soft ? 0.08 : 0.055) + 0.05 * clamp(S.wingForce / 500, 0, 1), luff * (1 - crashBlend), t);
  else gear.flutter(luff * (1 - crashBlend), t);

  // ---- arms: each shoulder takes the handle on its side
  const hA = rider.worldToLocal(g.localToWorld(cfg.handles[0].clone()));
  const hB = rider.worldToLocal(g.localToWorld(cfg.handles[1].clone()));
  const shL = neck.clone().add(V3(0.21, -0.08, 0)), shR = neck.clone().add(V3(-0.21, -0.08, 0));
  const [toL, toR] = hA.x > hB.x ? [hA, hB] : [hB, hA];
  [[shL, toL, P.uArmL, P.fArmL, P.handL, 1], [shR, toR, P.uArmR, P.fArmR, P.handR, -1]].forEach(([sh, hand, ua, fa, hm, sx]) => {
    if (crashBlend > 0.5) hand = sh.clone().add(V3(sx * 0.3, 0.3, 0.3));
    const d = hand.clone().sub(sh); if (d.length() > 0.63) hand = sh.clone().addScaledVector(d.normalize(), 0.63);
    const elbow = ik(sh, hand, 0.32, 0.32, V3(sx * 0.6, -1, -0.3));
    placeSeg(ua, sh, elbow); placeSeg(fa, elbow, hand); hm.position.copy(hand);
  });

  // ---- spray + wake
  const mastW = board.localToWorld(V3(0, 0, -0.18));
  const whM = waveHeight(mastW.x, mastW.z, t); mastW.y = whM;
  if (S.foiling && S.yb > whM && S.depth > 0) emit(mastW, V3(-fx * S.v * 0.25, 1.1, -fz * S.v * 0.25), 0.9, Math.round(S.v * 0.6));
  if (S.foiling && S.depth < 0.12 && S.depth > 0) emit(mastW, V3(0, 2.5, 0), 1.5, 8);          // foil near the surface: it fizzes
  if (S.contact && S.v > 1.5 && S.crash <= 0) {
    const nose = board.localToWorld(V3(0, 0, 0.55)); nose.y = wh;
    const side = V3(fz, 0, -fx).multiplyScalar(S.v * 0.35);
    for (const sd of [1, -1]) emit(nose, side.clone().multiplyScalar(sd).add(V3(0, S.v * 0.25, 0)), 0.6, Math.round(S.v * 0.8));
  }
  if (e.player && S.v > 0.8) {
    const last = wakePts[wakePts.length - 1];
    if (!last || Math.hypot(last.x - mastW.x, last.z - mastW.z) > 0.35) wakePts.push({ x: mastW.x, z: mastW.z, age: 0, w: S.foiling ? 0.08 : 0.25 });
    while (wakePts.length > WAKE_N) wakePts.shift();
  }
}

// ================================================================ race (slalom) state, filled by the race module below
const race = { active: false, gates: [] };

// ================================================================ camera
const camPos = V3(-8, 3, 0), camLook = V3();
function updateCamera(dt, t) {
  const fx = Math.sin(S.psi), fz = Math.cos(S.psi);
  const target = V3(S.x, board.position.y + 1.2, S.z);
  let want;
  if (camMode === 0) {
    const ww = V3(S.windFromX, 0, S.windFromZ);
    const off = V3(-fx * 7, 0, -fz * 7).addScaledVector(ww, 3.5).applyAxisAngle(_up, orbitYaw);
    want = V3(S.x + off.x, board.position.y + 2.2 + orbitPitch * 6, S.z + off.z);
  } else if (camMode === 1) {
    const a = t * 0.12 + orbitYaw;
    want = V3(S.x + Math.sin(a) * 9 + fx * 3, board.position.y + 0.9, S.z + Math.cos(a) * 9 + fz * 3);
  } else {
    want = V3(S.x - fx * 14 + 8, board.position.y + 14, S.z - fz * 14 + 8);

    $('modePanel').dataset.s = '';
    $('modePanel').innerHTML = `<span class="garrow" style="transform:rotate(${-rel * 180 / Math.PI - 90}deg)">➤</span>` +
      `Gate ${me.gate + 1}/${race.gates.length} · ${Math.round(Math.hypot(dx, dz))} m · ${fmtT(race.time)}` + (race.best ? ` · best ${fmtT(race.best)}` : '') + (race.ghostObj ? ' · 👻' : '');
  } else if (mode === 'downwind') {
    const dist = -(S.z - dw.z0), bestG = store.get('glide', 0);
    if (S.glide > bestG + 0.5 && S.glide > 5) store.set('glide', S.glide);
    $('modePanel').innerHTML = `Downwinder · ${Math.max(0, Math.round(dist))} m downwind · glide (no pump) ${S.glide.toFixed(1)} s · best ${Math.max(bestG, S.glide).toFixed(1)} s`;
  }
}

// ================================================================ photo mode: freeze, orbit, save a PNG
let photo = false;
const photoCam = { yaw: 0, pitch: 0.25, dist: 7 };
function togglePhoto() {
  photo = !photo; document.body.classList.toggle('photo', photo);
  if (photo) {
    const d = V3().subVectors(camera.position, board.position);
    photoCam.dist = clamp(d.length(), 3, 40); photoCam.yaw = Math.atan2(d.x, d.z); photoCam.pitch = clamp(Math.asin(d.y / d.length()), -0.1, 1.3);
    if (SND.master) SND.master.gain.value = 0;
  } else if (SND.master) SND.master.gain.value = SND.on ? 0.8 : 0;
}
function photoCamera() {
  const tgt = V3(S.x, board.position.y + 1.1, S.z), c = Math.cos(photoCam.pitch);
  camera.position.set(tgt.x + Math.sin(photoCam.yaw) * c * photoCam.dist, tgt.y + Math.sin(photoCam.pitch) * photoCam.dist, tgt.z + Math.cos(photoCam.yaw) * c * photoCam.dist);
  camera.position.y = Math.max(camera.position.y, waveHeight(camera.position.x, camera.position.z, simT) + 0.15);
  camera.lookAt(tgt);
}
function savePhoto() {
  renderer.render(scene, camera);
  const a = document.createElement('a'); a.href = renderer.domElement.toDataURL('image/png'); a.download = `wingfoil-${Date.now()}.png`; a.click();
}

// ================================================================ your colours
const COLOR_KEYS = [
  ['Wing body', () => GEAR.wing.colors, 'base'], ['Wing leading panel', () => GEAR.wing.colors, 'lead'],
  ['Wing tips', () => GEAR.wing.colors, 'tip'], ['Wing accent', () => GEAR.wing.colors, 'accent'],
  ['Parawing body', () => GEAR.para.colors, 'base'], ['Parawing edges', () => GEAR.para.colors, 'lead'], ['Parawing stripe', () => GEAR.para.colors, 'accent'],
  ['Vest', null, 'vest'], ['Board rail', null, 'rail'],
];
const DEFAULT_COLORS = JSON.parse(JSON.stringify({ wing: GEAR.wing.colors, para: GEAR.para.colors, vest: '#ff7a59', rail: '#1d6f7a' }));
function getColors() { return { wing: { ...GEAR.wing.colors }, para: { ...GEAR.para.colors }, vest: '#' + M.vest.color.getHexString(), rail: '#' + M.rail.color.getHexString() }; }
function applyColors(c) {
  Object.assign(GEAR.wing.colors, c.wing); Object.assign(GEAR.para.colors, c.para);
  M.vest.color.set(c.vest); M.rail.color.set(c.rail);
  for (const g of Object.values(gears)) { const m = g.canopy.material; m.map?.dispose(); m.map = canopyTexture(g.cfg); m.needsUpdate = true; }
  store.set('colors', c); buildColorPanel();
}
function buildColorPanel() {
  const c = getColors(), grid = $('colGrid'); grid.innerHTML = '';
  for (const [label, obj, key] of COLOR_KEYS) {
    const val = obj ? obj()[key] : c[key];
    const lab = document.createElement('label'); lab.textContent = label;
    const inp = document.createElement('input'); inp.type = 'color'; inp.value = val;
    inp.oninput = () => {
      const n = getColors();
      if (obj) (obj() === GEAR.wing.colors ? n.wing : n.para)[key] = inp.value; else n[key] = inp.value;
      applyColors(n);
    };
    grid.append(lab, inp);
  }
}
function randomColors() {
  const h = Math.random() * 360, hsl = (hh, s, l) => '#' + new THREE.Color().setHSL(((hh % 360) + 360) % 360 / 360, s, l).getHexString();
  applyColors({ wing: { base: hsl(h, 0.35, 0.92), lead: hsl(h, 0.8, 0.55), tip: hsl(h + 180, 0.6, 0.38), accent: hsl(h + 30, 0.85, 0.6) },
                para: { base: hsl(h + 60, 0.8, 0.7), lead: hsl(h + 240, 0.6, 0.25), tip: hsl(h + 240, 0.6, 0.25), accent: hsl(h, 0.85, 0.6) },
                vest: hsl(h + 15, 0.8, 0.58), rail: hsl(h + 180, 0.6, 0.35) });
}
$('cRand').onclick = randomColors; $('cReset').onclick = () => applyColors(JSON.parse(JSON.stringify(DEFAULT_COLORS)));
$('cClose').onclick = () => { $('colors').style.display = 'none'; };
const savedColors = store.get('colors', null);
if (savedColors) applyColors(savedColors); else buildColorPanel();

// ================================================================ toolbar + shortcuts
function updateToolbar() {
  $('bMode').textContent = MODES[mode] + ' ▾';
  $('bTod').textContent = `${TOD[todIdx].icon} ${TOD[todIdx].name}`;
  $('bSnd').textContent = SND.on ? '🔊' : '🔇';
}
const cycleMode = () => setMode({ free: 'slalom', slalom: 'downwind', downwind: 'free' }[mode]);
const cycleTod = () => setTimeOfDay((todIdx + 1) % TOD.length);
const toggleColors = () => { $('colors').style.display = $('colors').style.display === 'block' ? 'none' : 'block'; };
$('bMode').onclick = cycleMode; $('bTod').onclick = cycleTod; $('bCol').onclick = toggleColors;
$('bPhoto').onclick = togglePhoto; $('bSnd').onclick = toggleSound; $('bRec').onclick = () => toggleRecord();
$('pSave').onclick = savePhoto; $('pExit').onclick = togglePhoto;
addEventListener('keydown', e => {
  if (e.repeat || e.target.tagName === 'INPUT') return;
  if (e.code === 'KeyO') togglePhoto();
  if (photo) { if (e.code === 'Enter') savePhoto(); return; }
  if (e.code === 'KeyG') cycleMode();
  if (e.code === 'KeyL') cycleTod();
  if (e.code === 'KeyU') toggleColors();
  if (e.code === 'KeyN') toggleSound();
  if (e.code === 'KeyJ') jump(me);
});
updateToolbar();

// ================================================================ loop
const params = new URLSearchParams(location.search);
if (params.has('auto')) autopilot = true;
if (params.has('cam')) camMode = +params.get('cam');
if (params.get('gear') === 'para') setGear('para');
if (params.has('pro')) { S.pro = true; document.body.classList.add('pro'); }
if (params.get('test') === 'breach') { S.pro = true; S.assist = false; S.v = 7; keys.KeyS = true; }   // back foot, no assist -> must breach
$('gear').textContent = gear.cfg.name;
setHelp();
const tlog = [];
let minClear = 9, minHead = 9, nFr = 0, nClose = 0;     // lowest gear point minus floor, over the run (test of the anti-clipping)
// ?inspect=wing|para&ang=deg&elev=deg : the gear alone, held overhead like an umbrella, for modelling checks
const inspect = params.get('inspect');
if (inspect) { setGear(inspect); for (const r of riders) { r.board.visible = false; if (r.ai) r.gear.group.visible = false; } for (const id of ['hud', 'help', 'wind', 'map', 'toast', 'toolbar', 'credit']) $(id).style.display = 'none'; }
function tick(dt) {
  if (inspect) {
    simT += dt;
    gear.group.position.set(0, 2.2, 0.8);
    gear.group.quaternion.setFromEuler(new THREE.Euler(0.25, 0, Math.PI));
    if (!gear.model) updateCanopy(gear, 0.1, 0, simT);
    const a = (+params.get('ang') || 0) * D2R, e = (+(params.get('elev') ?? 15)) * D2R;
    camera.position.set(Math.sin(a) * Math.cos(e) * 5, 1.6 + Math.sin(e) * 5, Math.cos(a) * Math.cos(e) * 5);
    camera.lookAt(0, 1.7, 0); camPos.copy(camera.position); camLook.set(0, 1.7, 0);
    return;
  }
  const sub = 4;
  for (const r of riders) for (let i = 0; i < sub; i++) step(r, dt / sub, simT + dt * i / sub);
  simT += dt;
  for (const r of riders) pose(r, dt, simT);
  raceUpdate(dt);
  updateSpray(dt); updateWake(dt, simT); updateStreaks(dt, simT, S.x, S.z); updateGulls(dt, simT); updateDolphins(dt, simT); updateCamera(dt, simT);
  if (params.has('log')) {
    if (S.crash <= 0 && me.crashBlend < 0.01) { minClear = Math.min(minClear, lowestPoint(gear.group.quaternion, gear.group.position) - S.yb); minHead = Math.min(minHead, window.__gap ?? 9); nFr++; if ((window.__gap ?? 9) < 0.3) nClose++; }
    if (Math.round(simT * 60) % 15 === 0)
      tlog.push(`t=${simT.toFixed(2)} v=${S.v.toFixed(2)} yb=${S.yb.toFixed(2)} depth=${S.depth.toFixed(2)} foil=${S.foiling} air=${S.air} crash=${S.crash > 0 ? S.crashType : '-'} gate=${me.gate ?? '-'} rt=${race.time?.toFixed?.(1)} res=${(race.results || []).map(r => r.name + ':' + r.t.toFixed(1)).join('/')} ai=${riders.slice(1).map(r => r.S.v.toFixed(1) + (r.S.foiling ? 'F' : '') + (r.S.crash > 0 ? 'X' : '') + '@' + Math.hypot(r.S.x - S.x, r.S.z - S.z).toFixed(0)).join(',')}`);
  }
}
if (params.has('dolphins')) podTimer = +params.get('dolphins');
if (params.has('tod')) setTimeOfDay(+params.get('tod'));
if (params.has('mode')) setMode(params.get('mode'));
const warm = +params.get('warm') || 0, jumpAt = +params.get('jumpAt') || -1;
function warmUp() {
for (let i = 0; i < warm * 60; i++) { tick(1 / 60); if (jumpAt > 0 && Math.abs(simT - jumpAt) < 0.009) jump(me); }
if (params.has('photo')) togglePhoto();
if (params.has('colors')) toggleColors();
if (params.has('log')) console.log('LOG minClearAboveHull=' + minClear.toFixed(2) + ' minGapToBody=' + minHead.toFixed(2) + ' framesUnder30cm=' + nClose + '/' + nFr + '\n' + tlog.join('\n'));
}
// with ?waitModel the warm-up starts once the wing model is in (so test stats use it)
if (params.has('waitModel') && !params.has('procedural')) window.__onWingModel = warmUp; else warmUp();
let last = performance.now(), mapT = 0;
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now;   // rAF time can precede performance.now()
  if (photo) photoCamera(); else tick(dt);
  audioUpdate(dt); modePanelUpdate();
  ocean.position.set(Math.round(S.x / 4) * 4, 0, Math.round(S.z / 4) * 4);
  oceanMat.uniforms.uTime.value = simT;
  sunLight.position.set(S.x, 0, S.z).addScaledVector(sunDir, 50);
  sunLight.target.position.set(S.x, 0, S.z);
  for (const b of buoys) {
    const h = b.userData.home;
    const bx = h.x + Math.round((S.x - h.x) / 500) * 500, bz = h.y + Math.round((S.z - h.y) / 500) * 500;
    b.position.set(bx, waveHeight(bx, bz, simT) - 0.1, bz);
    b.rotation.set(Math.sin(simT + bx) * 0.08, 0, Math.cos(simT * 0.8 + bz) * 0.08);
  }
  if ((mapT -= dt) <= 0 && mapOn) { drawMap(simT); mapT = 0.4; }
  if (toastT > 0 && (toastT -= dt) <= 0) $('toast').style.opacity = 0;
  hud();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
window.__S = S;
</script>
