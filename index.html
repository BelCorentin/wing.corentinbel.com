<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wingfoil Sim</title>
<style>
  :root { --fg:#f4f7fa; --bg:#0b1a24; --accent:#ff7a59; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); font-family: system-ui, sans-serif; }
  canvas { display:block; }
  #hud { position:fixed; left:16px; top:16px; color:var(--fg); text-shadow:0 1px 3px #0008; pointer-events:none; }
  #speed { font-size:44px; font-weight:700; line-height:1; }
  #speed small { font-size:16px; font-weight:500; opacity:.8; }
  .row { font-size:14px; opacity:.9; margin-top:4px; }
  #mode { font-weight:700; color:var(--accent); text-shadow:0 1px 2px #000c; }
  #wind { position:fixed; right:20px; top:16px; width:84px; height:84px; border-radius:50%;
          background:#0006; display:grid; place-items:center; color:var(--fg); font-size:12px; }
  #arrow { position:absolute; width:4px; height:54px; background:var(--fg); border-radius:2px; }
  #arrow::after { content:""; position:absolute; bottom:-6px; left:-6px; border:8px solid transparent; border-top:12px solid var(--fg); }
  #windtxt { position:absolute; bottom:-22px; width:120px; text-align:center; }
  #help { position:fixed; left:16px; bottom:16px; color:var(--fg); font-size:13px; opacity:.85; background:#0005; padding:8px 12px; border-radius:8px; line-height:1.6; }
  #help b { color:var(--accent); }
  #rec { position:fixed; right:20px; bottom:16px; color:#fff; background:#d33; padding:4px 10px; border-radius:6px; font-weight:700; display:none; }
  #stam { width:120px; height:6px; background:#fff3; border-radius:3px; margin-top:6px; }
  #stam div { height:100%; background:var(--accent); border-radius:3px; }
</style>
</head>
<body>
<div id="hud">
  <div id="speed">0.0 <small>kn</small></div>
  <div class="row"><span id="mode">Displacement</span> · <span id="pos">Beam reach</span></div>
  <div class="row">Foil height <span id="height">0</span> cm</div>
  <div id="stam"><div></div></div>
</div>
<div id="wind"><div id="arrow"></div><div id="windtxt">wind</div></div>
<div id="help">
  <b>A / D</b> steer · <b>W</b> power · <b>S</b> depower · <b>Space</b> pump<br>
  <b>C</b> camera · <b>P</b> autopilot · <b>R</b> record video · drag mouse to orbit
</div>
<div id="rec">● REC</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.55;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 8000);

// sun
const SUN_ELEV = 14, SUN_AZ = 200;
const sunDir = new THREE.Vector3().setFromSphericalCoords(1,
  THREE.MathUtils.degToRad(90 - SUN_ELEV), THREE.MathUtils.degToRad(SUN_AZ));

// sky
const sky = new Sky();
sky.scale.setScalar(10000);
const su = sky.material.uniforms;
su.turbidity.value = 4; su.rayleigh.value = 1.6;
su.mieCoefficient.value = 0.004; su.mieDirectionalG.value = 0.85;
su.sunPosition.value.copy(sunDir);
scene.add(sky);

// bake sky into a cubemap: used for water reflections + PBR environment
const cubeRT = new THREE.WebGLCubeRenderTarget(512, { type: THREE.HalfFloatType });
const cubeCam = new THREE.CubeCamera(1, 20000, cubeRT);
cubeCam.update(renderer, scene);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromCubemap(cubeRT.texture).texture;

const HORIZON = new THREE.Color(0.62, 0.72, 0.80);
scene.fog = new THREE.Fog(HORIZON, 300, 4500);

const sunLight = new THREE.DirectionalLight(0xfff1dd, 2.2);
sunLight.position.copy(sunDir).multiplyScalar(50);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
Object.assign(sunLight.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 120 });
sunLight.shadow.bias = -0.0005;
scene.add(sunLight, sunLight.target);
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x1a3a48, 0.5));

// ---------------------------------------------------------------- waves (shared by GPU and physics)
// dirX, dirZ, amplitude (m), wavelength (m). Waves travel roughly downwind (-Z).
const WAVES = [
  [ 0.10, -1.00, 0.30, 42], [-0.35, -0.94, 0.20, 24], [ 0.45, -0.89, 0.13, 14],
  [-0.15, -0.99, 0.07,  8], [ 0.70, -0.71, 0.04, 5.0], [-0.60, -0.80, 0.03, 3.6],
].map(([x, z, a, l]) => { const n = Math.hypot(x, z); return [x / n, z / n, a, l]; });
const STEEP = 0.55;
const PHASES = WAVES.map((_, i) => i * 1.7);

function waveHeight(x, z, t) {
  let y = 0;
  for (let i = 0; i < WAVES.length; i++) {
    const [dx, dz, a, l] = WAVES[i];
    const k = 2 * Math.PI / l, w = Math.sqrt(9.81 * k);
    y += a * Math.sin(k * (dx * x + dz * z) - w * t + PHASES[i]);
  }
  return y;
}

// ---------------------------------------------------------------- ocean
function makeOceanGeometry(R, N) {
  // grid densest at the centre: coordinate = R * s^3, s in [-1, 1]
  const pos = new Float32Array((N + 1) * (N + 1) * 3), idx = [];
  const f = s => R * s * s * s;
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    const k = (j * (N + 1) + i) * 3;
    pos[k] = f(i / N * 2 - 1); pos[k + 1] = 0; pos[k + 2] = f(j / N * 2 - 1);
  }
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const a = j * (N + 1) + i, b = a + 1, c = a + N + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(idx);
  return g;
}

const oceanMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uWaves: { value: WAVES.map((w, i) => new THREE.Vector4(w[0], w[1], w[2], w[3])) },
    uPhase: { value: PHASES },
    uSteep: { value: STEEP },
    uSky: { value: cubeRT.texture },
    uSun: { value: sunDir },
    uHorizon: { value: HORIZON },
  },
  vertexShader: /* glsl */`
    uniform float uTime, uSteep;
    uniform vec4 uWaves[6];
    uniform float uPhase[6];
    varying vec3 vWorld; varying vec3 vN; varying float vCrest; varying float vH;
    void main() {
      vec3 p = (modelMatrix * vec4(position, 1.0)).xyz;
      float dist = length(p.xz - cameraPosition.xz);
      vec3 disp = vec3(0.0); vec3 n = vec3(0.0, 1.0, 0.0); float crest = 0.0;
      for (int i = 0; i < 6; i++) {
        vec4 w = uWaves[i];
        float fade = clamp(1.0 - dist / (w.w * 40.0), 0.0, 1.0);
        float A = w.z * fade;
        float k = 6.28318 / w.w, om = sqrt(9.81 * k);
        float Q = uSteep / (k * w.z * 6.0);
        float f = k * dot(w.xy, p.xz) - om * uTime + uPhase[i];
        float c = cos(f), s = sin(f);
        disp.x += Q * A * w.x * c; disp.z += Q * A * w.y * c; disp.y += A * s;
        n.x -= w.x * k * A * c; n.z -= w.y * k * A * c; n.y -= Q * k * A * s;
        crest += Q * k * A * s;
      }
      p += disp;
      vWorld = p; vN = n; vCrest = crest; vH = disp.y;
      gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform float uTime; uniform samplerCube uSky; uniform vec3 uSun; uniform vec3 uHorizon;
    varying vec3 vWorld; varying vec3 vN; varying float vCrest; varying float vH;
    void main() {
      vec3 V = cameraPosition - vWorld; float dist = length(V); V /= dist;
      // small ripples: analytic gradient of a sum of short sines, faded with distance
      vec2 g = vec2(0.0);
      float rf = clamp(1.0 - dist / 160.0, 0.0, 1.0);
      for (int i = 0; i < 8; i++) {
        float fi = float(i);
        float ang = fi * 2.399 + 0.3 + 0.25 * sin(uTime * 0.05 + fi);
        vec2 d = vec2(cos(ang), sin(ang));
        float L = 0.37 + fi * fi * 0.045 + fract(fi * 0.618) * 0.3;
        float k = 6.28318 / L, om = sqrt(9.81 * k);
        float a = 0.009 * L;
        g += d * a * k * cos(k * dot(d, vWorld.xz) - om * uTime + fi * 3.1);
      }
      vec3 N = normalize(vN + vec3(-g.x, 0.0, -g.y) * (0.25 + 0.75 * rf));
      if (dot(N, V) < 0.02) N = normalize(N + V * (0.02 - dot(N, V)));
      vec3 R = reflect(-V, N); R.y = abs(R.y);
      vec3 refl = textureCube(uSky, R).rgb;
      float fres = 0.02 + 0.98 * pow(1.0 - max(dot(N, V), 0.0), 5.0);
      // water body: deep blue + teal scattering on sunlit wave tops
      vec3 deep = vec3(0.004, 0.035, 0.06);
      vec3 teal = vec3(0.02, 0.22, 0.24);
      float sss = clamp(vH * 1.2 + 0.4, 0.0, 1.0) * (0.4 + 0.6 * max(dot(-V.xz, uSun.xz), 0.0));
      vec3 body = deep + teal * sss * 0.6;
      vec3 col = mix(body, refl, fres);
      float sd = max(dot(R, uSun), 0.0);
      col += vec3(1.0, 0.92, 0.78) * (pow(sd, 900.0) * 30.0 + pow(sd, 90.0) * 0.6);
      // foam on steep crests
      float foam = smoothstep(0.55, 0.9, vCrest) * (0.6 + 0.4 * sin(vWorld.x * 3.0 + vWorld.z * 2.0 + uTime));
      col = mix(col, vec3(0.85, 0.9, 0.92), foam * 0.5);
      // aerial perspective
      vec3 hz = textureCube(uSky, normalize(vec3(-V.x, 0.03, -V.z))).rgb;
      col = mix(col, hz, 1.0 - exp(-dist * 0.0009));
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const ocean = new THREE.Mesh(makeOceanGeometry(4000, 480), oceanMat);
ocean.frustumCulled = false;
scene.add(ocean);

// ---------------------------------------------------------------- materials
const M = {
  deck: new THREE.MeshStandardMaterial({ color: 0xf2f0ea, roughness: 0.35 }),
  rail: new THREE.MeshStandardMaterial({ color: 0x1d6f7a, roughness: 0.4 }),
  pad: new THREE.MeshStandardMaterial({ color: 0x2b2f33, roughness: 0.95 }),
  carbon: new THREE.MeshStandardMaterial({ color: 0x15171a, roughness: 0.3, metalness: 0.4 }),
  suit: new THREE.MeshStandardMaterial({ color: 0x1a1c20, roughness: 0.65 }),
  vest: new THREE.MeshStandardMaterial({ color: 0xff7a59, roughness: 0.55 }),
  skin: new THREE.MeshStandardMaterial({ color: 0xc48a68, roughness: 0.6 }),
  helmet: new THREE.MeshStandardMaterial({ color: 0xf5f5f0, roughness: 0.3 }),
  canopy: new THREE.MeshPhysicalMaterial({ color: 0xff8a5c, roughness: 0.45, transmission: 0.25,
           transparent: true, opacity: 0.92, side: THREE.DoubleSide }),
  canopy2: new THREE.MeshPhysicalMaterial({ color: 0x1fa3a8, roughness: 0.45, transmission: 0.2,
           transparent: true, opacity: 0.92, side: THREE.DoubleSide }),
  tube: new THREE.MeshStandardMaterial({ color: 0x17323b, roughness: 0.5 }),
};
const shadowy = o => { o.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } }); return o; };

// ---------------------------------------------------------------- board + foil (board frame: +Z = nose, origin = bottom of hull)
function makeBoard() {
  const g = new THREE.Group();
  const L = 1.55, W = 0.62, H = 0.13;
  const s = new THREE.Shape();
  s.moveTo(0, -L / 2);
  s.bezierCurveTo(W * 0.42, -L / 2, W / 2, -L * 0.3, W / 2, 0);
  s.bezierCurveTo(W / 2, L * 0.3, W * 0.3, L / 2, 0, L / 2);
  s.bezierCurveTo(-W * 0.3, L / 2, -W / 2, L * 0.3, -W / 2, 0);
  s.bezierCurveTo(-W / 2, -L * 0.3, -W * 0.42, -L / 2, 0, -L / 2);
  const ex = (shape, depth, bevel) => {
    const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel,
      bevelSize: bevel, bevelSegments: 4, curveSegments: 24 });
    geo.rotateX(Math.PI / 2);   // shape y -> +Z (nose), extrusion -> -Y
    return geo;
  };
  const hull = new THREE.Mesh(ex(s, H - 0.06, 0.03), M.deck);
  hull.position.y = H - 0.03;
  g.add(hull);
  const railStripe = new THREE.Mesh(ex(s, 0.03, 0.031), M.rail);
  railStripe.position.y = 0.045;
  railStripe.scale.set(1.002, 1, 1.002);
  g.add(railStripe);
  const pad = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.012, 0.95), M.pad);
  pad.position.set(0, H + 0.005, -0.12);
  g.add(pad);
  // foil
  const foil = new THREE.Group();
  const mastL = 0.9;
  const mast = new THREE.Mesh(new THREE.BoxGeometry(0.018, mastL, 0.12), M.carbon);
  mast.position.y = -mastL / 2;
  foil.add(mast);
  const fus = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.014, 0.75, 12), M.carbon);
  fus.rotation.x = Math.PI / 2; fus.position.set(0, -mastL, 0.05);
  foil.add(fus);
  const wingShape = (span, chord) => {
    const w = new THREE.Shape();
    w.moveTo(-span / 2, 0);
    w.quadraticCurveTo(0, chord * 1.3, span / 2, 0);
    w.quadraticCurveTo(0, -chord * 0.25, -span / 2, 0);
    const geo = new THREE.ExtrudeGeometry(w, { depth: 0.012, bevelEnabled: false, curveSegments: 24 });
    geo.rotateX(Math.PI / 2);
    return geo;
  };
  const fw = new THREE.Mesh(wingShape(0.85, 0.14), M.carbon); fw.position.set(0, -mastL + 0.01, 0.3);
  const st = new THREE.Mesh(wingShape(0.34, 0.07), M.carbon); st.position.set(0, -mastL + 0.01, -0.32);
  foil.add(fw, st);
  foil.position.z = -0.18;
  g.add(foil);
  return shadowy(g);
}

// ---------------------------------------------------------------- inflatable wing (wing frame: span = X, chord = -Z from leading edge, canopy normal = +Y)
function makeWing() {
  const g = new THREE.Group();
  const half = 1.8, chord0 = 1.45, NS = 40, NC = 8;
  const leY = x => -0.55 * (x / half) ** 2;                 // anhedral arc
  const chord = x => chord0 * Math.sqrt(Math.max(0, 1 - (x / half) ** 2)) + 0.05;
  // canopy surface, two colour panels (centre / tips)
  const makePanel = (x0, x1, mat) => {
    const pos = [], idx = [];
    const ns = Math.max(2, Math.round(NS * (x1 - x0) / (2 * half)));
    for (let i = 0; i <= ns; i++) {
      const x = x0 + (x1 - x0) * i / ns, c = chord(x);
      for (let j = 0; j <= NC; j++) {
        const u = j / NC;
        const camber = 0.09 * c * Math.sin(Math.PI * u) * (1 - 0.5 * u);
        pos.push(x * (1 - 0.06 * u), leY(x) + camber, -c * u);
      }
    }
    for (let i = 0; i < ns; i++) for (let j = 0; j < NC; j++) {
      const a = i * (NC + 1) + j, b = a + 1, c = a + NC + 1, d = c + 1;
      idx.push(a, b, c, b, d, c);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setIndex(idx); geo.computeVertexNormals();
    return new THREE.Mesh(geo, mat);
  };
  g.add(makePanel(-half, -0.55, M.canopy2), makePanel(-0.55, 0.55, M.canopy), makePanel(0.55, half, M.canopy2));
  // leading-edge tube and centre strut
  const lePts = []; for (let i = 0; i <= 30; i++) { const x = -half + 2 * half * i / 30; lePts.push(new THREE.Vector3(x, leY(x) + 0.02, 0.02)); }
  g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(lePts), 60, 0.075, 12), M.tube));
  const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.035, chord0, 12), M.tube);
  strut.rotation.x = Math.PI / 2; strut.position.set(0, 0.06, -chord0 / 2);
  g.add(strut);
  // handles under the strut
  for (const z of [-0.38, -0.95]) {
    const h = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.015, 8, 16, Math.PI), M.carbon);
    h.rotation.set(0, Math.PI / 2, Math.PI); h.position.set(0, 0.0, z);
    g.add(h);
  }
  return shadowy(g);
}

// ---------------------------------------------------------------- rider (rider frame: origin between feet, chest faces +Z, stance along X)
function makeRider() {
  const g = new THREE.Group();
  // fixed-length segments; IK keeps joint distances equal to these lengths
  const seg = (r, len, mat) => { const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, Math.max(0.01, len), 6, 12), mat); g.add(m); return m; };
  const parts = {
    thighL: seg(0.08, 0.42, M.suit), shinL: seg(0.062, 0.42, M.suit), thighR: seg(0.08, 0.42, M.suit), shinR: seg(0.062, 0.42, M.suit),
    torso: seg(0.17, 0.32, M.vest), uArmL: seg(0.052, 0.28, M.suit), fArmL: seg(0.044, 0.28, M.skin),
    uArmR: seg(0.052, 0.28, M.suit), fArmR: seg(0.044, 0.28, M.skin), neck: seg(0.055, 0.08, M.skin),
  };
  const hips = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 12), M.suit); hips.scale.set(1.25, 0.8, 0.9); g.add(hips); parts.hips = hips;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.11, 20, 16), M.skin);
  const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.125, 20, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), M.helmet);
  head.add(helmet); helmet.position.y = 0.01; helmet.rotation.x = -0.25;
  g.add(head); parts.head = head;
  for (const n of ['footL', 'footR']) { const f = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.06, 0.26), M.suit); g.add(f); parts[n] = f; }
  return { group: shadowy(g), parts };
}

const _up = new THREE.Vector3(0, 1, 0), _t = new THREE.Vector3(), _q = new THREE.Quaternion();
function placeSeg(mesh, a, b, r) {        // stretch a capsule between points a and b
  _t.subVectors(b, a); const len = _t.length();
  mesh.position.addVectors(a, b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(_up, _t.normalize());
}
function ik(root, target, l1, l2, pole) {   // two-bone IK, returns joint position
  const d = new THREE.Vector3().subVectors(target, root);
  const dist = THREE.MathUtils.clamp(d.length(), 0.05, l1 + l2 - 1e-3);
  d.normalize();
  const x = (l1 * l1 - l2 * l2 + dist * dist) / (2 * dist);
  const h = Math.sqrt(Math.max(0, l1 * l1 - x * x));
  const p = pole.clone().sub(d.clone().multiplyScalar(pole.dot(d))).normalize();
  return root.clone().addScaledVector(d, x).addScaledVector(p, h);
}

// ---------------------------------------------------------------- assemble
const board = makeBoard();
const riderObj = makeRider(); const rider = riderObj.group;
board.add(rider); rider.position.set(0, 0.14, -0.1);
const wing = makeWing();
scene.add(board, wing);

// buoys + islands for a sense of speed and place
const buoys = [];
const buoyMat = [new THREE.MeshStandardMaterial({ color: 0xff5a2e, roughness: 0.5 }), new THREE.MeshStandardMaterial({ color: 0xffd23a, roughness: 0.5 })];
for (let i = 0; i < 14; i++) {
  const b = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.0, 0.5, 1.6, 16), buoyMat[i % 2]);
  body.position.y = 0.5; b.add(body);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.3, 16), buoyMat[(i + 1) % 2]);
  b.add(base);
  b.userData.home = new THREE.Vector2((Math.random() - 0.5) * 500, (Math.random() - 0.5) * 500);
  shadowy(b); buoys.push(b); scene.add(b);
}
const islandMat = new THREE.MeshStandardMaterial({ color: 0x55665a, roughness: 1 });
for (let i = 0; i < 7; i++) {
  const geo = new THREE.SphereGeometry(1, 64, 24);
  const p = geo.attributes.position;
  for (let k = 0; k < p.count; k++) {
    const x = p.getX(k), y = p.getY(k), z = p.getZ(k);
    const n = 1 + 0.18 * Math.sin(x * 5 + i) * Math.cos(z * 4 - i) + 0.08 * Math.sin(x * 13 + z * 11);
    p.setY(k, y < 0 ? -0.1 : y * n * (0.7 + 0.3 * Math.sin(x * 2.3 + i)));
  }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, islandMat);
  const a = i / 7 * Math.PI * 2 + 0.4, r = 2200 + 900 * Math.sin(i * 3.1) ** 2;
  m.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
  m.scale.set(300 + 250 * Math.sin(i * 1.3) ** 2, 90 + 80 * Math.cos(i * 2.1) ** 2, 220 + 150 * Math.sin(i) ** 2);
  scene.add(m);
}

// ---------------------------------------------------------------- spray particles
const SPRAY_N = 1500;
const sprayPos = new Float32Array(SPRAY_N * 3), sprayVel = new Float32Array(SPRAY_N * 3), sprayLife = new Float32Array(SPRAY_N);
const sprayGeo = new THREE.BufferGeometry();
sprayGeo.setAttribute('position', new THREE.BufferAttribute(sprayPos, 3));
const sprayTex = (() => {

// ---------------------------------------------------------------- physics state
const S = {
  x: 0, z: 0, psi: Math.PI / 2, v: 0, h: 0, crash: 0, stamina: 1, pumpCD: 0, pumpAnim: 0,
  steer: 0, power: 0.7, tack: 1, tackSmooth: 1, lean: 0, wind: 8, windFromX: 0, windFromZ: 1,
  awaDeg: 90, twaDeg: 90, foiling: false,
};
const keys = {};
let autopilot = false, camMode = 0, orbitYaw = 0, orbitPitch = 0;
addEventListener('keydown', e => {
  if (e.repeat) return;
  keys[e.code] = true;
  if (e.code === 'KeyP') autopilot = !autopilot;
  if (e.code === 'KeyC') camMode = (camMode + 1) % 3;
  if (e.code === 'KeyR') toggleRecord();
  if (e.code === 'Space') { e.preventDefault(); pump(); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
let dragging = false, lastX = 0, lastY = 0;
addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', e => {

  lastX = e.clientX; lastY = e.clientY;

function pump() {
  if (S.crash > 0 || S.pumpCD > 0 || S.stamina < 0.15) return;
  S.v += S.foiling ? 0.3 : 0.55;
  S.pumpCD = 0.45; S.pumpAnim = 0.45; S.stamina -= 0.12;
}

const RHO = 1.225, WING_AREA = 5, MASS = 95, V_TAKEOFF = 5.0;
const smooth = (a, b, x) => { const t = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function wingEfficiency(awa) {        // drive coefficient vs apparent wind angle (deg from bow)
  if (awa < 28) return 0;
  if (awa < 50) return smooth(28, 50, awa);
  if (awa < 120) return 1;
  return 1 - 0.45 * smooth(120, 180, awa);

function step(dt, t) {
  // gusty wind, blowing toward -Z (comes FROM +Z)
  S.wind = 8 + 1.6 * Math.sin(t * 0.11) + 0.9 * Math.sin(t * 0.37 + 1.3) + 0.4 * Math.sin(t * 1.1);
  const fx = Math.sin(S.psi), fz = Math.cos(S.psi);
  const wax = 0 - fx * S.v, waz = -S.wind - fz * S.v;     // apparent wind velocity
  const aws = Math.hypot(wax, waz);

  S.awaDeg = THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(fx * S.windFromX + fz * S.windFromZ, -1, 1)));
  S.twaDeg = THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(fz, -1, 1)));
  // which side the wind comes from (+1 = from board's left / +X side in board frame)
  const side = Math.sign((Math.cos(S.psi)) * S.windFromX + (-Math.sin(S.psi)) * S.windFromZ) || 1;
  S.tack = side;

  // controls
  let steer = 0, power = 0.72;
  if (autopilot) {
    const target = (Math.floor(t / 22) % 2 ? -1 : 1) * THREE.MathUtils.degToRad(100);
    let err = Math.atan2(Math.sin(target - S.psi), Math.cos(target - S.psi));
    steer = THREE.MathUtils.clamp(err * 1.5 + 0.25 * Math.sin(t * 0.7), -1, 1);
    power = S.h > 0.62 ? 0.4 : 0.85;
    if (!S.foiling && S.crash <= 0 && Math.random() < 0.04) pump();
  } else {
    steer = (keys.KeyA || keys.ArrowLeft ? 1 : 0) - (keys.KeyD || keys.ArrowRight ? 1 : 0);
    if (keys.KeyW || keys.ArrowUp) power = 1;
    if (keys.KeyS || keys.ArrowDown) power = 0.2;
  }
  S.steer += (steer - S.steer) * Math.min(1, dt * 4);
  S.power += (power - S.power) * Math.min(1, dt * 3);

  S.pumpCD = Math.max(0, S.pumpCD - dt); S.pumpAnim = Math.max(0, S.pumpAnim - dt);
  S.stamina = Math.min(1, S.stamina + dt * 0.08);

  if (S.crash > 0) {

  } else {
    const drive = 0.5 * RHO * WING_AREA * 1.1 * aws * aws * wingEfficiency(S.awaDeg) * S.power;
    const drag = S.foiling ? 2.4 * S.v * S.v + 12 : 6 * S.v * S.v + 18 * S.v;
    const turnDrag = Math.abs(S.steer) * S.v * 14;

    S.psi += S.steer * (0.35 + 0.05 * S.v) * dt;

    if (S.v > V_TAKEOFF || (S.foiling && S.v > V_TAKEOFF - 0.8)) {

      S.h += (hT - S.h) * Math.min(1, dt * 1.4);

    } else {
      S.h += (0 - S.h) * Math.min(1, dt * 3);

function splash(strength) {

// ---------------------------------------------------------------- pose: board, rider, wing
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
function pose(t) {
  const fx = Math.sin(S.psi), fz = Math.cos(S.psi);
  const wh = waveHeight(S.x, S.z, t);
  const foilF = smooth(0, 0.25, S.h);
  // board rides the waves when in displacement; foil smooths chop when flying
  const y = wh * (1 - 0.75 * foilF) + S.h - 0.07 * (1 - foilF);
  board.position.set(S.x, y, S.z);

  const pitchW = (waveHeight(S.x + fx * sl, S.z + fz * sl, t) - waveHeight(S.x - fx * sl, S.z - fz * sl, t)) / (2 * sl);
  const rollW = (waveHeight(S.x + fz * sl, S.z - fx * sl, t) - waveHeight(S.x - fz * sl, S.z + fx * sl, t)) / (2 * sl);

  S.tackSmooth += (S.tack - S.tackSmooth) * Math.min(1, 1 / 60 * 3);
  const s = S.tackSmooth;                      // +1: wind from board +X side
  rider.rotation.order = 'YXZ';
  rider.rotation.y = -Math.PI / 2 * s;          // chest -> leeward
  const powerLean = THREE.MathUtils.clamp(S.power * (S.foiling ? 0.32 : 0.18), 0, 0.4);
  S.lean += (powerLean - S.lean) * 0.05;
  const fall = S.crash > 0 ? Math.min(1, (2.2 - S.crash) * 2.5) * 1.3 : 0;
  rider.rotation.x = -S.lean + fall;            // lean back to windward, or fall leeward when crashing
  rider.rotation.z = 0;

  const P = riderObj.parts;
  const frontX = s > 0 ? 1 : -1;                // rider-frame X that points to the nose
  // after the -90° yaw (s>0) rider +X maps to board +Z (nose)

  placeSeg(P.neck, neck, headP, 0.05);
  P.head.position.copy(headP); P.head.rotation.y = frontX * 0.7;   // look toward the nose

  const flow = new THREE.Vector3(leeX, 0, leeZ).normalize();

  const aoa = THREE.MathUtils.degToRad(8 + 14 * S.power) * (S.crash > 0 ? 0 : 1);
  const leeSide = new THREE.Vector3(-S.windFromX, 0, -S.windFromZ);

  const handMid = rider.localToWorld(handMidLocal.clone());
  const strutMid = new THREE.Vector3(0, -0.04, -0.66).applyQuaternion(wing.quaternion);

function updateWake(dt, t) {
  for (const p of wakePts) p.age += dt;
  for (let i = 0; i < WAKE_N; i++) {
    const p = wakePts[Math.min(i, wakePts.length - 1)];
    if (!p) { wakeAlpha[i * 2] = wakeAlpha[i * 2 + 1] = 0; continue; }
    const q = wakePts[Math.min(i + 1, wakePts.length - 1)] || p, pr = wakePts[Math.min(Math.max(0, i - 1), wakePts.length - 1)];
    let dx = q.x - pr.x, dz = q.z - pr.z; const l = Math.hypot(dx, dz) || 1; dx /= l; dz /= l;
    const w = p.w + p.age * 0.12;
    const y = waveHeight(p.x, p.z, t) + 0.03;
    wakePos.set([p.x - dz * w, y, p.z + dx * w, p.x + dz * w, y, p.z - dx * w], i * 6);
    const a = i < wakePts.length ? Math.max(0, 1 - p.age / 9) * smooth(0, 6, i) : 0;
    wakeAlpha[i * 2] = wakeAlpha[i * 2 + 1] = a;
  }

}

// ---------------------------------------------------------------- camera
const camPos = new THREE.Vector3(-8, 3, 0), camLook = new THREE.Vector3();
function updateCamera(dt, t) {
  const fx = Math.sin(S.psi), fz = Math.cos(S.psi);
  const target = new THREE.Vector3(S.x, board.position.y + 1.2, S.z);
  let want;
  if (camMode === 0) {         // chase, slightly to windward so the wing is visible
    // behind and to windward: see the rider's back and the wing beyond
    const ww = new THREE.Vector3(S.windFromX, 0, S.windFromZ);
    const off = new THREE.Vector3(-fx * 7, 0, -fz * 7).addScaledVector(ww, 3.5).applyAxisAngle(_up, orbitYaw);
    want = new THREE.Vector3(S.x + off.x, board.position.y + 2.2 + orbitPitch * 6, S.z + off.z);
  } else if (camMode === 1) {  // cinematic: slow orbit, low over the water
    const a = t * 0.12 + orbitYaw;
    want = new THREE.Vector3(S.x + Math.sin(a) * 9 + fx * 3, board.position.y + 0.9, S.z + Math.cos(a) * 9 + fz * 3);
  } else {                     // drone
    want = new THREE.Vector3(S.x - fx * 14 + 8, board.position.y + 14, S.z - fz * 14 + 8);
  }
  const k = 1 - Math.exp(-dt * 3);
  camPos.lerp(want, k);
  const wy = waveHeight(camPos.x, camPos.z, t);
  if (camPos.y < wy + 0.6) camPos.y = wy + 0.6;
  camLook.lerp(target, 1 - Math.exp(-dt * 6));
  camera.position.copy(camPos); camera.lookAt(camLook);
}

// ---------------------------------------------------------------- HUD
const $ = id => document.getElementById(id);
function pointOfSail(twa) {
  if (twa < 35) return 'In irons'; if (twa < 70) return 'Upwind'; if (twa < 110) return 'Beam reach';
  if (twa < 150) return 'Broad reach'; return 'Downwind';
}
function hud() {
  $('speed').innerHTML = `${(S.v * 1.944).toFixed(1)} <small>kn</small>`;
  $('mode').textContent = S.crash > 0 ? 'Crash!' : S.foiling ? 'Foiling' : S.v > V_TAKEOFF - 1.2 ? 'Pump to take off' : 'Displacement';
  $('pos').textContent = pointOfSail(S.twaDeg);
  $('height').textContent = Math.round(S.h * 100);
  $('stam').firstElementChild.style.width = `${S.stamina * 100}%`;
  // arrow points where the wind blows, relative to camera view
  const camYaw = Math.atan2(camLook.x - camPos.x, camLook.z - camPos.z);
  const windTo = Math.PI;      // toward -Z
  $('arrow').style.transform = `rotate(${(windTo - camYaw) * -180 / Math.PI + 180}deg)`;
  $('windtxt').textContent = `${(S.wind * 1.944).toFixed(0)} kn`;
}

// ---------------------------------------------------------------- recording
let recorder = null, chunks = [];
function toggleRecord() {
  if (recorder) { recorder.stop(); return; }
  const stream = renderer.domElement.captureStream(60);
  const mime = ['video/webm;codecs=vp9', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 16e6 });
  chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    a.download = `wingfoil-${Date.now()}.webm`; a.click();
    recorder = null; $('rec').style.display = 'none';
  };
  recorder.start(); $('rec').style.display = 'block';
}

// ---------------------------------------------------------------- loop
const params = new URLSearchParams(location.search);
if (params.has('auto')) autopilot = true;
if (params.has('cam')) camMode = +params.get('cam');
let simT = 0, last = performance.now();
// warm start for screenshots: ?warm=N simulates N seconds before the first frame
const warm = +params.get('warm') || 0;
for (let i = 0; i < warm * 60; i++) { step(1 / 60, simT); pose(simT); updateSpray(1 / 60); updateCamera(1 / 60, simT); simT += 1 / 60; }

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const sub = 4;
  for (let i = 0; i < sub; i++) step(dt / sub, simT + dt * i / sub);
  simT += dt;
  pose(simT);
  updateSpray(dt); updateWake(dt, simT); updateCamera(dt, simT);
  // keep the ocean grid and shadow camera centred on the rider
  ocean.position.set(Math.round(S.x / 4) * 4, 0, Math.round(S.z / 4) * 4);
  oceanMat.uniforms.uTime.value = simT;
  sunLight.position.set(S.x, 0, S.z).addScaledVector(sunDir, 50);
  sunLight.target.position.set(S.x, 0, S.z);
  for (const b of buoys) {
    const h = b.userData.home;
    const bx = h.x + Math.round((S.x - h.x) / 500) * 500, bz = h.y + Math.round((S.z - h.y) / 500) * 500;
    b.position.set(bx, waveHeight(bx, bz, simT) - 0.1, bz);
    b.rotation.set(Math.sin(simT + bx) * 0.08, 0, Math.cos(simT * 0.8 + bz) * 0.08);
  }
  hud();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
window.__S = S;
</script>
